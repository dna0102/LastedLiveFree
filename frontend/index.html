<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasted Live Free</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="views.css">
</head>
<body>
<header class="titlebar" id="titlebar">
  <div class="tb-left">
    <div class="brand" id="brand"></div>
    <nav class="nav-tabs" id="nav-tabs" hidden>
      <button data-view="dashboard">Dashboard</button>
      <button data-view="studio">Studio</button>
      <button data-view="customise">Customise</button>
    </nav>
  </div>
  <div class="tb-center" id="tb-center"></div>
  <div class="tb-right">
    <div class="tb-actions" id="tb-actions"></div>
    <div class="win-ctl">
      <button class="wc" id="wc-min" title="Minimize"></button>
      <button class="wc" id="wc-max" title="Maximize"></button>
      <button class="wc close" id="wc-close" title="Close"></button>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="icons.js"></script>
<script src="core.js"></script>
<script src="shell.js"></script>
<script src="login.js"></script>
<script src="dashboard.js"></script>
<script src="studio.js"></script>
<script src="sources.js"></script>
<script src="layers.js"></script>
<script src="audio.js"></script>
<script src="tools.js"></script>
<script src="chat.js"></script>
<script src="customise.js"></script>
<script src="setup.js"></script>
<script src="boot.js"></script>
</body>
</html>
